<body>
  <div id="root"></div>

  <!-- Phone-stage scaler — computes --stage-scale from the actual
       visual viewport so the prototype fits inside Safari's collapsing
       URL bar on mobile. CSS calc() with 100dvh isn't reliable on
       iOS Safari, so JS owns the source of truth. -->
  <script>
    (function () {
      var PHONE_W = 393, PHONE_H = 852;
      var root = document.documentElement;
      function getStageVars() {
        var s = getComputedStyle(document.querySelector('.phone-stage') || root);
        var bezel = parseFloat(s.getPropertyValue('--phone-bezel')) || 24;
        var pad = parseFloat(s.getPropertyValue('--stage-pad')) || 16;
        return { bezel: bezel, pad: pad };
      }
      function getInsets() {
        var probe = document.createElement('div');
        probe.style.cssText =
          'position:fixed;visibility:hidden;pointer-events:none;' +
          'top:env(safe-area-inset-top);left:env(safe-area-inset-left);' +
          'right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);';
        document.body.appendChild(probe);
        var cs = getComputedStyle(probe);
        var insets = {
          top: parseFloat(cs.top) || 0,
          right: parseFloat(cs.right) || 0,
          bottom: parseFloat(cs.bottom) || 0,
          left: parseFloat(cs.left) || 0,
        };
        document.body.removeChild(probe);
        return insets;
      }
      function update() {
        var vv = window.visualViewport;
        var vw = (vv && vv.width)  || window.innerWidth;
        var vh = (vv && vv.height) || window.innerHeight;
        var v = getStageVars();
        var ins = getInsets();
        // Effective padding = max(stage pad, safe-area inset on that side).
        var padTop    = Math.max(v.pad, ins.top);
        var padBottom = Math.max(v.pad, ins.bottom);
        var padLeft   = Math.max(v.pad, ins.left);
        var padRight  = Math.max(v.pad, ins.right);
        var availW = vw - padLeft - padRight;
        var availH = vh - padTop  - padBottom;
        var totalW = PHONE_W + v.bezel * 2;
        var totalH = PHONE_H + v.bezel * 2;
        var scale = Math.min(1, availW / totalW, availH / totalH);
        // Guard against negative / NaN before first layout.
        if (!isFinite(scale) || scale <= 0) scale = 1;
        root.style.setProperty('--stage-scale', String(scale));
      }
      // Re-run on every viewport change: URL bar collapse, orientation,
      // keyboard show/hide, window resize.
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', update);
        window.visualViewport.addEventListener('scroll', update);
      }
      window.addEventListener('resize', update);
      window.addEventListener('orientationchange', update);
      // First measurement after layout so dvh / safe-area values are real.
      requestAnimationFrame(update);
      // And again after fonts/babel/react load, since the .phone-stage
      // element only exists after React mounts.
      setTimeout(update, 0);
      setTimeout(update, 200);
      setTimeout(update, 800);
    })();
  </script>
